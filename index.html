<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Audio Instrument</title>

    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">

</head>


<body>
    <dialog id="intro-modal" class="intro-modal">
        <div class="modal-content">

            <!-- Sound icon -->
            <div class="intro-icons">
            <img src="img/sound.png" alt="Sound icon">
            <img src="img/volume.png" alt="Volume bars">
            </div>

            <h2>I'm going to make some noise! 🔊</h2>

            <hr>

            <!-- Keyboard imgs -->
                 <div class="intro-keys">
                    <img src="img/key-A.png">
                    <img src="img/key-S.png">
                    <img src="img/key-D.png">
                    <img src="img/key-F.png">
                    <img src="img/key-G.png">
                </div>

            <p>Press the letter keys to play</p>

            
            <button id="intro-modal-close" type="button">
            Let's play!
            </button>

        </div>
    </dialog>



<!--     <dialog id="intro-modal">
        <p>I'm going to make some noise!!!</p>
        <button id="intro-modal-close">ok</button>
    </dialog>
    -->


    <div class="background">
        <div class="moon-glow"></div>
        <div class="moon"></div>

            <div class="ground-back">
            <svg viewBox="0 0 1000 200" preserveAspectRatio="none">
                <path d="
                    M0 100
                    C150 20 300 20 450 100
                    C600 180 750 180 900 100
                    C950 70 1000 70 1000 70
                    L1000 200
                    L0 200
                    Z
                " />
            </svg>
        </div>

        <div class="ground">
            <svg viewBox="0 0 1000 200" preserveAspectRatio="none">
                <path d="
                    M0 100
                    C150 20 300 20 450 100
                    C600 180 750 180 900 100
                    C950 70 1000 70 1000 70
                    L1000 200
                    L0 200
                    Z
                " />
            </svg>
        </div>

        <div class="tree tree1">
            <div class="top"></div>
            <div class="bottom"></div>
            <div class="trunk"></div>
        </div>

        <div class="tree tree2">
            <div class="top"></div>
            <div class="bottom"></div>
            <div class="trunk"></div>
        </div>

        <div class="tree tree3">
            <div class="top"></div>
            <div class="bottom"></div>
            <div class="trunk"></div>
        </div>

    <div class="tree tree4">
            <div class="top"></div>
            <div class="bottom"></div>
            <div class="trunk"></div>
        </div>
    
    </div>

    <img src="img/fox.png" class="fox">

    <div class="stars"></div>


    <script src="main.js"></script>

</body>
</html>
